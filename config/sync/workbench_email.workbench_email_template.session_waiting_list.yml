id: session_waiting_list
label: 'Session on the waiting list'
format: plain_text
subject: '[node:title] added to the waiting list for [config_page:event_details:field_event_name]'
recipient_types:
  author:
    id: author
    provider: workbench_email
    status: true
    settings: {  }
bundles: {  }
body:
  value: "Hello,\r\n\r\nWe are writing to inform you that your proposal \"[node:title]\" has been placed on our waiting list for [config_page:event_details:field_event_name] [config_page:event_details:field_event_year].\r\n\r\nWhat this means:\r\n- Your session proposal has the potential to be included in the program if a spot becomes available. If this happens, the organizers will contact you to step in as a speaker.\r\n- A session slot may open up if a confirmed speaker cannot attend the conference.\r\n\r\nNext steps:\r\n- To confirm your spot on the waiting list, please reply to this email. This will help us to respond quickly if a slot becomes available.\r\n\r\nIf we do not receive your reply before 7 days from now, we will understand that you do not wish to be considered as a backup.\r\n\r\nThank you again for your interest and for being part of [config_page:event_details:field_event_name].\r\n\r\n-- The [config_page:event_details:field_event_name] [config_page:event_details:field_event_year] team"
  format: plain_text
replyTo: '[site:mail]'
transitions:
  editorial: {  }
  session_acceptance:
    waiting_list: waiting_list
